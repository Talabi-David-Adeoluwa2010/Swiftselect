<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaCart - Online Store</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f9f9f9; }
        header { background: #111; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; }
        .product-card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 1rem; text-align: center; }
        .product-card img { max-width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
        .btn { background: #007bff; color: white; border: none; padding: 0.5rem 1rem; cursor: pointer; border-radius: 4px; margin-top: 1-rem; }
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>

    <header>
        <h1>NovaCart</h1>
        <div id="cart-count">Cart: 0 items</div>
    </header>

    <div class="container">
        <h2>Featured Products</h2>
        <div class="product-grid" id="product-grid">
            <!-- Products will be dynamically injected here via JavaScript -->
        </div>
    </div>

    <script>
        // Sample Product Data
        const products = [
            { id: 1, name: "Smart Gadget Pro", price: 49.99, image: "https://via.placeholder.com/250" },
            { id: 2, name: "Minimalist Watch", price: 29.99, image: "https://via.placeholder.com/250" }
        ];

        const grid = document.getElementById('product-grid');

        function renderProducts() {
            grid.innerHTML = products.map(product => `
                <div class="product-card">
                    <img src="${product.image}" alt="${product.name}">
                    <h3>${product.name}</h3>
                    <p>$${product.price.toFixed(2)}</p>
                    <button class="btn" onclick="addToCart(${product.id})">Add to Cart</button>
                </div>
            `).join('');
        }

        let cartCount = 0;
        function addToCart(id) {
            cartCount++;
            document.getElementById('cart-count').innerText = `Cart: ${cartCount} items`;
            alert(`Product added to cart!`);
        }

        renderProducts();
    </script>
</body>
</html>
